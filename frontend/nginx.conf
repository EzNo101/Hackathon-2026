server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Hashované assety z Vite lze cachovat napořád.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Data a fotky: soubor musí existovat, jinak 404.
    # Bez tohoto bloku by SPA fallback vrátil index.html se stavem 200
    # (frontend by pak parsoval HTML jako JSON).
    location /data/ {
        expires 1h;
        try_files $uri =404;
    }

    # Fotky jsou volitelně připojené jako volume do /usr/share/nginx/html/photos.
    location /photos/ {
        expires 1h;
        try_files $uri =404;
    }

    # Jednostránková aplikace: neznámé cesty vrací index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
